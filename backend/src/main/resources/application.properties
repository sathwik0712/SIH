server.port=8080
server.servlet.context-path=/

# Application details
spring.application.name=bhoomisetu-backend

# H2 Database in PostgreSQL Compatibility Mode
spring.datasource.url=jdbc:h2:mem:bhoomisetu_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA & Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (for debugging if needed)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# File Upload Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Configuration
bhoomisetu.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
bhoomisetu.jwt.expiration-ms=86400000

# Logging
logging.level.in.gov.bhoomisetu=INFO
logging.level.org.springframework.security=WARN
